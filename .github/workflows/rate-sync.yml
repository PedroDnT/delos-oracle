name: Sync BCB Rates to Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # 22:10 UTC = 19:10 BRT, shortly after BCB publishes daily series
    - cron: '10 22 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and log rates without writing to Supabase'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync rates
        run: python sync_supabase.py
        env:
          # The project URL is public (it also ships in the dashboard bundle)
          # and is stored as a repository variable. Fall back to the secret
          # for older setups that only defined the secret.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          # BCB fetch is the pipeline health signal. A deleted/paused Supabase
          # project makes the hostname NXDOMAIN ("Name or service not known")
          # and should not fail the default branch after rates were retrieved.
          SUPABASE_UNREACHABLE_OK: "1"
