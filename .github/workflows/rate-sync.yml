name: Sync BCB Rates to Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # 22:10 UTC = 19:10 BRT, shortly after BCB publishes daily series
    - cron: '10 22 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and log rates without writing to Supabase'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync rates
        run: python sync_supabase.py
        env:
          # Prefer the secret (this is what succeeded on 12 Aug). The
          # repository variable is the same value the dashboard ships, used
          # only if the secret is empty or its host does not resolve.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL_FALLBACK: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
