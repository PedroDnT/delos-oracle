name: Comprehensive Test Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - contracts
          - backend
          - frontend
          - performance

permissions:
  contents: read

jobs:
  # Smart Contract Test Suite
  contract-tests:
    name: Contract Test Suite
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'contracts' || github.event.inputs.test_type == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run Solidity tests
        run: npx hardhat test solidity

      - name: Run Mocha tests
        run: npx hardhat test mocha

      - name: Coverage report
        run: npx hardhat test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage
          path: contracts/coverage/
          if-no-files-found: ignore

  # Backend Test Suite
  backend-tests:
    name: Backend Test Suite
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'backend' || github.event.inputs.test_type == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-type:
          - unit
          - integration
          - api
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx

      - name: Run ${{ matrix.test-type }} tests
        run: |
          pytest tests/${{ matrix.test-type }} -v \
            --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.test-type }}
          path: backend/coverage.xml
          if-no-files-found: ignore

  # Frontend Test Suite
  frontend-tests:
    name: Frontend Test Suite
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'frontend' || github.event.inputs.test_type == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - unit
          - component
          - e2e
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        if: matrix.test-suite == 'unit'
        run: npx jest __tests__/unit --ci --coverage

      - name: Component Tests
        if: matrix.test-suite == 'component'
        run: npx jest __tests__/components --ci

      - name: Install Playwright browser
        if: matrix.test-suite == 'e2e'
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        if: matrix.test-suite == 'e2e'
        run: npx playwright test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.test-suite }}-results
          path: |
            frontend/coverage/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Performance Testing
  performance-tests:
    name: Performance Testing
    if: github.event.inputs.test_type == 'performance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 test script
        run: |
          cat > performance-test.js << 'EOF'
          import http from 'k6/http'
          import { check, sleep } from 'k6'

          export const options = {
            stages: [
              { duration: '30s', target: 20 },
              { duration: '1m', target: 20 },
              { duration: '30s', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
            },
          }

          const BASE_URL = __ENV.API_URL || 'http://localhost:8000'

          export default function () {
            const responses = http.batch([
              ['GET', `${BASE_URL}/health`],
              ['GET', `${BASE_URL}/rates`],
              ['GET', `${BASE_URL}/rates/IPCA`],
            ])

            responses.forEach(response => {
              check(response, {
                'status is 200': (r) => r.status === 200,
                'response time < 500ms': (r) => r.timings.duration < 500,
              })
            })

            sleep(1)
          }
          EOF

      - name: Run performance tests
        run: |
          k6 run performance-test.js --out json=results.json

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: results.json

  # Test Results Summary
  test-summary:
    name: Test Results Summary
    needs: [contract-tests, backend-tests, frontend-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Generate test report
        run: |
          {
            echo "# Test Results Summary"
            echo ""
            echo "| Suite | Result |"
            echo "| --- | --- |"
            echo "| Contracts | ${{ needs.contract-tests.result }} |"
            echo "| Backend (unit, integration, api) | ${{ needs.backend-tests.result }} |"
            echo "| Frontend (unit, component, e2e) | ${{ needs.frontend-tests.result }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## 🧪 Test Results',
              '',
              '| Suite | Result |',
              '| --- | --- |',
              '| Contracts | ${{ needs.contract-tests.result }} |',
              '| Backend | ${{ needs.backend-tests.result }} |',
              '| Frontend | ${{ needs.frontend-tests.result }} |',
              '',
              `[Full test report](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
